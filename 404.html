<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 · Aquí no queda ni una miga</title>
<style>
  :root{--bg:#f6f1e7;--ink:#2b2a26;--muted:#7a7468;--plate:#fff;--rim:#e7dfcf;--accent:#c4572e}
  @media (prefers-color-scheme:dark){:root{--bg:#1c1b18;--ink:#f1ece2;--muted:#a59f92;--plate:#2a2925;--rim:#3a3833;--accent:#e07a4f}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center;padding:24px 16px;text-align:center;overflow:hidden}
  main{max-width:520px;width:100%}
  .num{font-size:clamp(64px,22vw,128px);line-height:1;letter-spacing:-.04em;font-weight:700;display:flex;align-items:center;justify-content:center;gap:.06em}
  .scene{position:relative;width:min(54vw,240px);aspect-ratio:1;margin:8px auto 4px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .plate{position:absolute;inset:10%;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--plate) 0 55%,var(--rim) 56% 58%,var(--plate) 59% 100%);box-shadow:0 18px 40px -18px rgba(0,0,0,.35);animation:wobble 4s ease-in-out infinite}
  .fork,.knife{position:absolute;top:8%;bottom:8%;width:9%;border-radius:8px;background:linear-gradient(var(--muted),var(--muted))}
  .fork{left:-2%;transform:rotate(-8deg)}
  .knife{right:-2%;transform:rotate(8deg);border-radius:40px 8px 8px 8px}
  .fork::before{content:"";position:absolute;top:0;left:-30%;right:-30%;height:28%;background:repeating-linear-gradient(90deg,var(--muted) 0 18%,transparent 18% 28%)}
  .crumb{position:absolute;border-radius:40%;background:#c9a46a;transition:transform .5s ease,opacity .5s ease}
  .crumb.gone{transform:scale(0) translateY(-20px);opacity:0}
  @keyframes wobble{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  h1{font-size:clamp(22px,6vw,30px);margin:10px 0 10px;font-weight:600}
  p{color:var(--muted);font-size:17px;line-height:1.55;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .hint{margin-top:18px;font-size:14px;color:var(--accent);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:1.4em}
</style>
</head>
<body>
<main>
  <div class="num" aria-label="404">4<span class="scene" id="scene" role="button" aria-label="Rebañar el plato">
    <span class="fork"></span><span class="plate" id="plate"></span><span class="knife"></span>
  </span>4</div>
  <h1>Aquí ya no queda ni una miga.</h1>
  <p>Llegaste tarde: alguien se ha comido esta página entera, con la tabla incluida. Lo sentimos, el chef no guarda tuppers.</p>
  <div class="hint" id="hint">Toca el plato para rebañar las migas</div>
</main>
<script>
  const plate=document.getElementById('plate'),hint=document.getElementById('hint'),scene=document.getElementById('scene');
  const lines=["Mmm… sabía a jamón.","Esa era de queso curado.","Una aceituna rebelde.","Casi… queda una.","Plato limpio. Ni el lavavajillas lo deja así.","No insistas, de verdad que no hay más."];
  function addCrumbs(){for(let i=0;i<6;i++){const c=document.createElement('span');c.className='crumb';const a=Math.random()*Math.PI*2,r=12+Math.random()*24,s=4+Math.random()*7;c.style.cssText=`width:${s}px;height:${s*.8}px;left:calc(50% + ${Math.cos(a)*r}% - ${s/2}px);top:calc(50% + ${Math.sin(a)*r}% - ${s/2}px)`;plate.appendChild(c)}}
  addCrumbs();let n=0;
  scene.addEventListener('click',()=>{const c=plate.querySelector('.crumb:not(.gone)');if(c){c.classList.add('gone');}hint.textContent=lines[Math.min(n,lines.length-1)];n++;});
</script>
</body>
</html>
